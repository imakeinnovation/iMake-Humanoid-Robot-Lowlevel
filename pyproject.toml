[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imake_humanoid_robot_lowlevel"
version = "2025.09.07"
description = "Low-level control for iMake Humanoid Robot"
authors = [
    { name = "iMake Humanoid Robot Project Developers" },
    { name = "-T.K.-" },
]
maintainers = [
    { name = "iMake Humanoid Robot Project Developers" },
    { name = "-T.K.-" },
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["robotics", "lowlevel"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "psutil",
    "numpy",
    "omegaconf",
    "PyYAML",
    "pyserial",
    "python-can",
    "cc.udp",
    "onnxruntime",
    "inputs",
    "loop-rate-limiters",
]

[project.optional-dependencies]
torch-policy = [
    "torch",
]

[project.urls]
repository = "https://github.com/imakeinnovation/iMake-Humanoid-Robot-Lowlevel"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["imake_humanoid_robot_lowlevel*"]
